[build-system]
requires = ["hatchling==1.30.0"]
build-backend = "hatchling.build"

[project]
name = "telegram-ai-bot"
version = "0.1.0"
description = "Private Telegram text chat with persistent PostgreSQL history"
requires-python = ">=3.12,<3.13"
dependencies = ["aiogram==3.31.0", "aiohttp==3.14.5", "psycopg[binary]==3.3.7", "psycopg-pool==3.3.3"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "ruff==0.17.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_ai"]
